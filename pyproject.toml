[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukrainian-homonym-pipeline"
version = "0.1.0"
description = "Reproducible pipeline for constructing a Ukrainian homonym dictionary."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "openai>=1.60",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/homonym_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
